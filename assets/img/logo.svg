<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 74" width="64" height="74" role="img" aria-label="АЗС Технологии">
  <defs>
    <linearGradient id="shell" x1="0" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#F3E27E"/>
      <stop offset="0.45" stop-color="#E4BE1E"/>
      <stop offset="1" stop-color="#B9920A"/>
    </linearGradient>
    <radialGradient id="inner" cx="0.38" cy="0.32" r="0.75">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.55" stop-color="#F2F7FB"/>
      <stop offset="1" stop-color="#C3D6E8"/>
    </radialGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <!-- внешняя капля: золотой корпус -->
  <path d="M32 3 C32 3 9 32.5 9 46.5 a23 23 0 1 0 46 0 C55 32.5 32 3 32 3 Z" fill="url(#shell)"/>
  <!-- внутренняя капля: бело-голубая -->
  <path d="M32 11.5 C32 11.5 16.5 34 16.5 46.5 a15.5 15.5 0 1 0 31 0 C47.5 34 32 11.5 32 11.5 Z" fill="url(#inner)"/>
  <!-- блик-полумесяц -->
  <path d="M23.5 39 a13.5 13.5 0 0 0 15 15.5" fill="none" stroke="#A6C0D8" stroke-width="3" stroke-linecap="round" opacity="0.75"/>
  <!-- лёгкий золотой отсвет сверху -->
  <path d="M32 6 C32 6 15 30 13 43 c6-11 14-24 19-30 Z" fill="#FFFFFF" opacity="0.35"/>
</svg>
